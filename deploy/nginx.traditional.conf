# ============================================================
# 传统部署（非 Docker）专用 Nginx 配置
# 进程由 PM2 管理：
#   - ThinkJS API : 127.0.0.1:8360
#   - Nuxt SSR    : 127.0.0.1:3000
# 统一静态资源根目录 /var/www/blog/server/www （按实际路径调整）：
#   - /cms/    admin 后台 SPA  （pnpm build:admin 产物 -> server/www/cms/）
#   - /static/ 代码自带固定资源
#   - /upload/ 运行时上传图片（持久化，部署勿覆盖）
# ============================================================
upstream nuxt_front {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream thinkjs_api {
    server 127.0.0.1:8360;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com www.example.com;

    # 统一静态资源根目录：admin、static、upload 都在这里
    root /var/www/blog/server/www;

    # Admin 后台 SPA（构建时 app.baseURL = /cms/）
    location /cms/ {
        try_files $uri $uri/ /cms/index.html;
    }
    location = /cms {
        return 301 /cms/;
    }

    # 固定静态资源 / 运行时上传图片
    location ~ ^/(static|upload)/ {
        expires max;
        etag on;
        access_log off;
        try_files $uri @api;
    }

    # 后端接口：/front 给前端 API，/admin 给 admin SPA 的 API，rss/sitemap 同由 ThinkJS 提供
    location ~ ^/(front|admin|rss|sitemap)(/|\.xml|$) {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_pass http://thinkjs_api;
        proxy_redirect off;
    }

    # 兜底：static/upload 文件不存在时回源到后端
    location @api {
        proxy_set_header Host $http_host;
        proxy_pass http://thinkjs_api;
    }

    # 其余所有请求交给 Nuxt 前端 SSR
    location / {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://nuxt_front;
        proxy_redirect off;
    }
}
