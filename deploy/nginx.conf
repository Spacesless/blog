# 前后端分离部署 —— Docker / docker-compose 专用
# （传统非 Docker 部署请使用 nginx.traditional.conf）
# - Nuxt 前端（SSR）：nuxt_front:3000，承载所有页面
# - ThinkJS 后端 API：thinkjs_api:8360，承载接口、rss、sitemap
# - 统一静态资源根 /usr/share/nginx/server-www（与 node 容器共享 server/www 卷）：
#     /cms/ admin SPA、/static/ 固定资源、/upload/ 上传图片
upstream nuxt_front {
    server node:3000;
    keepalive 32;
}

upstream thinkjs_api {
    server node:8360;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com www.example.com;

    # 统一静态资源根目录：admin、static、upload 都在这里
    root /usr/share/nginx/server-www;

    # Admin 后台 SPA（构建时 app.baseURL = /cms/）
    location /cms/ {
        try_files $uri $uri/ /cms/index.html;
    }
    location = /cms {
        return 301 /cms/;
    }

    # 固定静态资源 / 运行时上传图片
    location ~ ^/(static|upload)/ {
        expires max;
        etag on;
        access_log off;
        try_files $uri @api;
    }

    # 后端接口：/front 给前端 API，/admin 给 admin SPA 的 API，rss/sitemap 同由 ThinkJS 提供
    location ~ ^/(front|admin|rss|sitemap)(/|\.xml|$) {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_pass http://thinkjs_api;
        proxy_redirect off;
    }

    # 兜底：static/upload 文件不存在时回源到后端
    location @api {
        proxy_set_header Host $http_host;
        proxy_pass http://thinkjs_api;
    }

    # 其余所有请求交给 Nuxt 前端 SSR
    location / {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://nuxt_front;
        proxy_redirect off;
    }
}
